<div class="library-layout">
  <div class="row page-row">
    <div class="col-2 left-bar">
      <app-genre-list
        (genreSelected)="onGenreSelected($event)"
      ></app-genre-list>
    </div>
    <div class="col-8 page-container">
      <div class="info-container">
        <div class="library-header">
          <h1 class="library-title">Library</h1>
          <p class="library-subtitle">
            Explore your collection of books, manage your reading status, and
            discover new titles.
          </p>
          <div class="table-body">
            <h1 class="library-title">Latest added</h1>
            <!-- <div class="library-search-container">
            <app-search
              (searchResults)="handleSearchResults($event)"
            ></app-search>
          </div> -->

            @if (books.length === 0) {
              <div class="loading">Loading books...</div>
            }
            @if (books.length > 0) {
              <app-book-cover-list
                [books]="books"
                [currentUserId]="currentUserId"
                [user]="user"
                (onUpdateStatus)="updateStatus($event)"
                (onSave)="saveBook($event)"
                (bookRowClicked)="onBookRowClicked($event)"
              ></app-book-cover-list>
            }

            @if (showInfoCard) {
              <div class="info-card-overlay">
                <div class="info-card-popup">
                  <app-info-card
                    [id]="selectedBook?.bookId ?? ''"
                    [imageUrl]="
                      selectedBook?.coverImagePath ||
                      'assets/images/book-covers/BrownBook.svg'
                    "
                    [col2]="infoCardCol2"
                    [col3]="infoCardCol3"
                    [actions]="infoCardActions"
                    (close)="closeInfoCard()"
                  >
                  </app-info-card>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
    <div class="col-2 right-bar"></div>
  </div>
</div>
