<form class="auth-form" (ngSubmit)="onLogin()">
  <div class="auth-form__heading">
    <h2>Welcome back!</h2>
    <p>Log in to continue your adventure.</p>
  </div>

  <div class="nn-field">
    <i class="bi bi-person-fill"></i>
    <input
      class="nn-input"
      id="username"
      name="username"
      type="text"
      [(ngModel)]="username"
      placeholder="Username"
      aria-label="Username"
      autocomplete="username"
      required
    />
  </div>

  <div class="nn-field">
    <i class="bi bi-lock-fill"></i>
    <input
      class="nn-input"
      id="password"
      name="password"
      [type]="showPassword ? 'text' : 'password'"
      [(ngModel)]="password"
      placeholder="Password"
      aria-label="Password"
      autocomplete="current-password"
      required
    />
    <button
      type="button"
      class="nn-field__trailing"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      (click)="showPassword = !showPassword"
    >
      <i class="bi" [class.bi-eye-slash]="!showPassword" [class.bi-eye]="showPassword"></i>
    </button>
  </div>

  <div class="auth-form__options">
    <span class="auth-form__forgot nn-placeholder" title="Coming soon">Forgot password?</span>
  </div>

  @if (errorMessage) {
    <p class="auth-form__error" role="alert">
      <i class="bi bi-exclamation-circle"></i>{{ errorMessage }}
    </p>
  }

  <button type="submit" class="nn-btn nn-btn--primary nn-btn--ornate nn-btn--block">
    Log in
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
      <path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z" />
      <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
    </svg>
  </button>
</form>
