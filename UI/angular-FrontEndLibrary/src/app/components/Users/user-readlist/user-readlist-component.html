<h1>Reservationer</h1>
@if (readList?.length) {
<div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Boktitel</th>
        <th>Författare</th>
        <th>Tillagd i läslista</th>
      </tr>
    </thead>
    <tbody>
      @for (readList of readList; track readList) {
      <tr>
        <td>{{ readList.book?.title }}</td>
        <td>{{ readList.book?.author }}</td>
        <td>{{ readList.createdAt | date:'yyyy-MM-dd' }}</td>
        <td></td>
      </tr>
      }
    </tbody>
  </table>
</div>
} @else {
<div>Inga reservationer.</div>
}
