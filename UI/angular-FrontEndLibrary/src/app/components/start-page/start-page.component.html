<div class="nn-theme nn-parchment start-page">
  <div class="start-card">
    <aside class="start-hero" aria-hidden="true">
      <img
        src="assets/images/login-page/DragonLoginTransparentBG.png"
        alt=""
        class="start-hero__art"
      />
    </aside>

    <section class="start-auth" [class.start-auth--compact]="showRegister">
      <img src="assets/images/login-page/castle-sketch.png" alt="" class="start-auth__sketch start-auth__sketch--left" />
      <img src="assets/images/login-page/castle-sketch.png" alt="" class="start-auth__sketch start-auth__sketch--right" />
      <span class="nn-corner nn-corner--tl"></span>
      <span class="nn-corner nn-corner--tr"></span>
      <span class="nn-corner nn-corner--bl"></span>
      <span class="nn-corner nn-corner--br"></span>
      <span class="nn-edge-ornament start-auth__edge start-auth__edge--top"></span>

      <div class="start-brand">
        <img
          src="assets/images/login-page/dragon-medallion.png"
          alt=""
          class="start-brand__logo"
        />
        <div class="start-brand__name">Nyria Nest</div>
        <div class="start-brand__tagline">Find your next adventure</div>
      </div>
      <div class="nn-divider"><span class="nn-divider__mark"></span></div>

      @if (!showRegister) {
        <app-login></app-login>
        <div class="nn-divider"><span class="nn-muted">or</span></div>
        <button class="nn-btn nn-btn--outline nn-btn--block" (click)="showRegister = true">
          Sign up
        </button>
      } @else {
        <app-register-user></app-register-user>
        <p class="start-auth__switch">
          Already have an account?
          <button type="button" class="nn-link-button" (click)="showRegister = false">Log in</button>
        </p>
      }

      <span class="nn-edge-ornament start-auth__edge start-auth__edge--bottom"></span>
    </section>
  </div>
</div>
