<!--app.component.html-->

@if (isAuthenticated()) {
  <div class="nn-theme nn-shell" [class.sidebar-open]="sidebarOpen">
    <app-topbar class="nn-shell__topbar" (menuToggle)="sidebarOpen = !sidebarOpen"></app-topbar>
    <app-sidebar class="nn-shell__sidebar" (navigate)="sidebarOpen = false"></app-sidebar>
    @if (sidebarOpen) {
      <div class="nn-shell__backdrop" (click)="sidebarOpen = false"></div>
    }
    <main class="nn-shell__main">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <main class="app-body">
    <router-outlet></router-outlet>
  </main>
}
